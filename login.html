<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1 class="brand"><a href="index.html"><img src="lotus-logo.svg" alt=""><span>Loja</span></a></h1>
            <nav>
                <a href="index.html">Início</a>
                <a href="sobre.html">Sobre</a>
                <a href="contato.html">Contato</a>
                <a href="carrinho.html" id="link-carrinho">Carrinho (0)</a>
                <a href="login.html" id="link-login">Entrar</a>
                <a href="admin.html" id="link-admin" style="display: none;">Admin</a>
                <button id="btn-sair" style="display: none;" onclick="fazerLogout()">Sair</button>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-welcome" aria-labelledby="welcome-title">
            <div class="auth-welcome-copy">
                <p class="auth-eyebrow">Um cantinho para florescer</p>
                <h2 id="welcome-title">Seja bem-vindo</h2>
                <p>Que bom ter você por aqui. Entre para acompanhar seus pedidos ou crie sua conta para descobrir cada novidade com calma.</p>
            </div>
            <div class="auth-lotus" aria-hidden="true">
                <img src="lotus-flower.svg" alt="">
            </div>
        </section>

        <section class="auth-panel" aria-labelledby="auth-title">
            <form id="form-auth" class="auth-form">
                <h2 id="auth-title">Entre ou crie sua conta</h2>
                <label class="auth-field">E-mail
                    <input type="email" id="email" placeholder="voce@exemplo.com" autocomplete="email" required>
                </label>
                <label class="auth-field">Senha
                    <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
                </label>
                <div class="auth-actions">
                    <button type="submit" class="btn-acao" onclick="setAcao('login')">Entrar</button>
                    <button type="submit" class="btn-acao auth-register" onclick="setAcao('cadastro')">Cadastrar</button>
                </div>
            </form>
        </section>
    </main>

    <footer><p>&copy; 2026 Loja. Todos os direitos reservados.</p></footer>
    <script src="app.js"></script>
    <script>
        let acaoAtual = 'login';
        function setAcao(acao) { acaoAtual = acao; }

        document.getElementById('form-auth').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const senha = document.getElementById('senha').value;

            if (acaoAtual === 'cadastro') {
                const usuarios = MockDB.obterTabela('usuarios');
                if (usuarios.some(usuario => usuario.email.toLowerCase() === email)) {
                    alert('Este e-mail já tem cadastro. Entre com sua senha.');
                    return;
                }
                MockDB.inserir('usuarios', { email, senha });
                alert("Cadastro realizado! Agora você pode fazer login.");
            } else {
                const usuarios = MockDB.obterTabela('usuarios');
                const existe = usuarios.find(u => u.email.toLowerCase() === email && u.senha === senha);
               
                if (existe) {
                    sessionStorage.setItem('usuarioLogado', JSON.stringify({ email }));
                    window.location.href = 'index.html';
                } else {
                    alert("Usuário não encontrado ou senha incorreta.");
                }
            }
        });
    </script>
</body>
</html>
